<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Oferta — Mazuryland</title>
  <meta
    name="description"
    content="Szczegóły oferty działki — Mazuryland."
  />

  <link rel="stylesheet" href="style.css" />
  <style>
  /* ===== WYMUSZONY UKŁAD SZCZEGÓŁÓW OFERTY ===== */

  #offer-detail {
    width: 100% !important;
    overflow-x: hidden !important;
  }

  #offer-detail .offer-detail-section {
    width: 100% !important;
    padding: 70px 0 !important;
    overflow: hidden !important;
  }

  #offer-detail .offer-detail-grid {
    width: calc(100% - 40px) !important;
    max-width: 1280px !important;
    margin: 0 auto !important;

    display: grid !important;
    grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr) !important;
    gap: 40px !important;
    align-items: start !important;
  }

  #offer-detail .offer-gallery {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    grid-column: auto !important;
    overflow: hidden !important;
  }

  #offer-detail .offer-detail-photo {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    height: auto !important;
    aspect-ratio: 16 / 10 !important;
    border-radius: 28px !important;
    overflow: hidden !important;
    background: #e7eee9 !important;
  }

  #offer-detail .offer-detail-photo img {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  #offer-detail .offer-detail-panel {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    grid-column: auto !important;
  }

  #offer-detail .offer-gallery-thumbs {
    width: 100% !important;
    max-width: 100% !important;
    display: grid !important;
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    gap: 10px !important;
    margin-top: 12px !important;
  }

  #offer-detail .offer-gallery-thumb {
    display: block !important;
    width: 100% !important;
    min-width: 0 !important;
    height: 90px !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 14px !important;
    overflow: hidden !important;
    cursor: pointer !important;
  }

  #offer-detail .offer-gallery-thumb img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  @media (max-width: 900px) {
    #offer-detail .offer-detail-grid {
      grid-template-columns: 1fr !important;
    }

    #offer-detail .offer-gallery-thumbs {
      grid-template-columns: repeat(3, 1fr) !important;
    }
  }
</style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Mazuryland">
        <span class="logo-icon">
          <img src="images/logo.png" alt="Mazuryland" class="logo-img" />
        </span>
        <span class="logo-text">Mazuryland</span>
      </a>

      <nav class="nav" aria-label="Menu główne">
        <a href="index.html#oferta">Oferta</a>
        <a href="index.html#kontakt">Kontakt</a>
      </nav>
    </div>
  </header>

  <main id="offer-detail"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© Mazuryland</p>

      <div class="footer-links">
        <a href="polityka-prywatnosci.html">Polityka prywatności</a>
        <p>Działki na Warmii i Mazurach</p>
      </div>
    </div>
  </footer>

  <script src="offers.js"></script>
</body>
</html>
